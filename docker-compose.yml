# The database is NOT declared here on purpose: it lives on a separate,
# shared server and is reached through DATABASE_URL only. Nothing in this file
# may create, drop or own it.
#
# Startup order: migrate (runs once, must exit 0) -> app (must go healthy).
#
# TLS and the public domain are handled by Dokploy's Traefik, not by this file.
# Declare the domain in Dokploy (Domains tab); Dokploy injects the Traefik
# labels itself. All this file has to do is join `dokploy-network` so Traefik
# can reach the app, and never publish a port to the host.
#
# Environment: Dokploy writes the variables from its Environment tab into a
# `.env` file beside this compose file, which serves both the `env_file:`
# directives and the `${...}` substitutions below. Running the stack by hand
# needs the same `.env` present - `docker compose` picks it up automatically,
# so no --env-file flag is involved. `.env.production.example` lists every
# variable that has to be filled in.

services:
  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?thiếu DATABASE_URL - xem .env.production.example}
    restart: "no"
    logging: &log-opts
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      target: runner
      args:
        ALLOWED_ORIGINS: ${APP_DOMAIN:?thiếu APP_DOMAIN}
    env_file: .env
    environment:
      # Points at the volume below, not at the working directory.
      UPLOAD_DIR: /data/uploads
      # Runtime copy of the build argument. Harmless when the baked-in value
      # already matches, and it makes the mismatch visible if it does not.
      ALLOWED_ORIGINS: ${APP_DOMAIN}
    expose:
      - "3000" # reached by Traefik over dokploy-network - never published to the host
    networks:
      # `default` keeps the compose-internal network; `dokploy-network` is what
      # Dokploy's Traefik is attached to. Dropping either one breaks routing.
      - default
      - dokploy-network
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *log-opts

  # Off by default. Run on demand:
  #   docker compose --profile tools run --rm dbtools "pg_dump ..."
  dbtools:
    image: postgres:18-alpine
    profiles: ["tools"]
    env_file: .env
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./backups:/backups
      # Read-only: this service backs the uploads up, it never edits them.
      # Mounted here so the scripts need not guess the prefixed volume name.
      - uploads:/data/uploads:ro
    entrypoint: ["sh", "-c"]
    command: ["echo 'dùng: docker compose --profile tools run --rm dbtools \"pg_dump ...\"'"]

networks:
  # Created by Dokploy when it installs Traefik - this stack only joins it.
  dokploy-network:
    external: true

volumes:
  uploads:
